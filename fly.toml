# fly.toml app configuration file generated for AgentGuard
app = "agentguard-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[services.http_checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"
  method = "get"
  path = "/health"
